name: Parity Sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches breakage from new dependency releases and advisories.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Install and run Parity
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.parity-upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP for sample tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, fileinfo, json
          coverage: xdebug

      - name: Install sample dependencies
        working-directory: code
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run sample tests
        working-directory: code
        run: ./vendor/bin/phpunit --configuration phpunit.xml --colors=never

      - name: Install Parity
        run: |
          composer global require "testparity/parity:1.4.1" --prefer-dist --no-progress --no-interaction
          composer global config bin-dir --absolute >> "$GITHUB_PATH"

      - name: Remove stale coverage evidence
        run: |
          rm -rf -- .parity
          test ! -e parity-coverage.json

      - name: Generate and check per-test coverage
        run: |
          set -o pipefail
          parity test --config=parity.yaml --no-check
          test -s .parity/per-test/index.json
          markdown_status=0
          parity check --config=parity.yaml --format=github > parity-comment.md || markdown_status=$?
          parity check --config=parity.yaml --format=json --show-tests > parity-result.json
          exit "$markdown_status"

      - name: Upload fresh Parity evidence
        id: parity-upload
        if: ${{ always() && hashFiles('parity-result.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-per-test-evidence
          path: |
            .parity/per-test
            parity-result.json
            parity-comment.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  parity-comment:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.parity.outputs.artifact-id != '' }}
    needs: parity
    permissions:
      pull-requests: write
    uses: testparity/cli/.github/workflows/parity-comment.yml@18489a20181f4d012a93563481e179a6b8b23ecc # v1.4.1
    with:
      artifact-name: parity-per-test-evidence
      report-path: parity-comment.md
